<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amoo | 青心意创 Cyan Robotics</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .back-btn {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 100;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 100px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
  }
  .back-btn:hover {
    background: #E85A1F;
    border-color: #E85A1F;
    transform: translateX(-2px);
  }
  .back-btn svg {
    transition: transform 0.3s ease;
  }
  .back-btn:hover svg {
    transform: translateX(-3px);
  }
  .video-container {
    width: 100%;
    max-width: 1200px;
    aspect-ratio: 16/9;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    background: #111;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  @media (max-width: 768px) {
    .video-container { border-radius: 12px; }
    .video-info h1 { font-size: 22px; }
    .back-btn { top: 16px; left: 16px; padding: 8px 16px; font-size: 13px; }
  }
  .lang-switch {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 100;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: #E85A1F;
    border: 1.5px solid #E85A1F;
    padding: 6px 16px;
    border-radius: 100px;
    transition: all 0.3s;
    user-select: none;
    white-space: nowrap;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(16px);
  }
  .lang-switch:hover {
    background: #E85A1F;
    color: white;
  }

</style>
<base target="_blank">
</head>
<body>

<!-- 语言切换按钮 -->
<div id="lang-btn" class="lang-switch" onclick="toggleLang()">English</div>

<!-- 中文版 -->
<div id="content-zh" class="lang-content" style="display:none;">
<a href="index.html" target="_self" class="back-btn">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M19 12H5M12 19l-7-7 7-7"/>
  </svg>
  返回主页
</a>

<div class="video-container">
  <video controls autoplay playsinline poster="">
    <source src="amoo视频.mp4" type="video/mp4">
    您的浏览器不支持视频播放。
  </video>
</div>
</div>

<!-- English Version -->
<div id="content-en" class="lang-content" style="display:none;">
<a href="index.html" target="_self" class="back-btn">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M19 12H5M12 19l-7-7 7-7"/>
  </svg>
  Back
</a>

<div class="video-container">
  <video controls autoplay playsinline poster="">
    <source src="amoo视频.mp4" type="video/mp4">
    Your browser does not support video playback.
  </video>
</div>
</div>

<script>
  function switchLang(lang) {
    const btn = document.getElementById('lang-btn');
    if (lang === 'zh') {
      document.getElementById('content-zh').style.display = 'flex';
      document.getElementById('content-en').style.display = 'none';
      document.documentElement.lang = 'zh-CN';
      document.title = 'Amoo | 青心意创 Cyan Robotics';
      if (btn) btn.textContent = 'English';
    } else {
      document.getElementById('content-en').style.display = 'flex';
      document.getElementById('content-zh').style.display = 'none';
      document.documentElement.lang = 'en';
      document.title = 'Amoo | Cyan Robotics';
      if (btn) btn.textContent = '中文';
    }
    localStorage.setItem('cyan-lang', lang);
  }

  function toggleLang() {
    const current = localStorage.getItem('cyan-lang') || 'zh';
    switchLang(current === 'zh' ? 'en' : 'zh');
  }

  const savedLang = localStorage.getItem('cyan-lang') || 'zh';
  switchLang(savedLang);
</script>

</body>
</html>
